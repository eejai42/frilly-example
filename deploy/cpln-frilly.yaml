kind: workload
name: frilly-prototype
description: Frilly local directory prototype, rebuilt from one Effortless rulebook (Postgres + generated API + app in one container).
tags:
  project: frilly-example
spec:
  type: serverless
  containers:
    - name: frilly
      cpu: 500m
      memory: 1Gi
      image: /org/effortlessapi/image/IMAGE_NAME_TAG
      inheritEnv: false
      env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "8080"
      ports:
        - number: 8080
          protocol: http
  defaultOptions:
    autoscaling:
      metric: rps
      target: 100
      maxConcurrency: 0
      minScale: 0
      maxScale: 1
      scaleToZeroDelay: 3600
    capacityAI: false
  firewallConfig:
    external:
      inboundAllowCIDR: ["0.0.0.0/0"]
      outboundAllowCIDR: ["0.0.0.0/0"]
